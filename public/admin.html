<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leverage Audit — Pilotexport</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">LEVERAGE <span>AUDIT</span></div>
      <div class="pilot-badge">Pilotexport</div>
    </header>
    <main class="main">
      <section class="card">
        <h2>Exportera pilotdata</h2>
        <p class="lede">Ange din EXPORT_TOKEN. Token sparas inte i webbläsaren.</p>
        <label for="token"><strong>EXPORT_TOKEN</strong></label>
        <input id="token" type="password" autocomplete="off" style="width:100%;padding:12px;margin:10px 0 18px;border:1px solid #cfcfcf;border-radius:8px" />
        <div class="btn-row">
          <button class="btn btn-primary" id="csv">Ladda ner CSV</button>
          <button class="btn btn-secondary" id="json">Ladda ner JSON</button>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>
  </div>
<script>
async function download(format) {
  const token = document.getElementById('token').value.trim();
  const status = document.getElementById('status');
  if (!token) { status.textContent = 'Ange EXPORT_TOKEN först.'; return; }
  status.textContent = 'Hämtar…';
  try {
    const r = await fetch('/api/export?format=' + format, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = format === 'json' ? 'leverage-audit-export.json' : 'leverage-audit-export.csv';
    a.click();
    URL.revokeObjectURL(url);
    status.textContent = 'Export klar.';
  } catch (e) {
    status.textContent = 'Export misslyckades: ' + e.message;
  }
}
document.getElementById('csv').addEventListener('click', () => download('csv'));
document.getElementById('json').addEventListener('click', () => download('json'));
</script>
</body>
</html>
